name: Agent Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Diff stats
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          dels=$(git diff --diff-filter=D --name-only "$base" "$head" | wc -l)
          renames=$(git diff --diff-filter=R --name-only "$base" "$head" | wc -l)
          echo "Deletions(files): $dels, Renames: $renames"
          echo "dels=$dels" >> $GITHUB_OUTPUT

      - name: Enforce low deletions (unless allow-delete)
        run: |
          LABEL_OK=$(jq -r '.pull_request.labels[].name' <<<"${{ toJson(github.event) }}" | grep -q '^allow-delete$' && echo ok || echo no)
          if [ "$LABEL_OK" = "no" ] && [ "${{ steps.diff.outputs.dels }}" -gt 1 ]; then
            echo "Too many deleted files. Use MOVE-FIRST or add label 'allow-delete' with justification."
            exit 1
          fi

      - name: Fail on stub smells (NO-STUB)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files=$(git diff --name-only "$base" "$head" | tr '\n' ' ')
          bad=$(
            git diff -U0 "$base" "$head" -- $files \
            | grep -E '^\+.*(pass|raise NotImplementedError|TODO|FIXME)' \
            | wc -l
          )
          if [ "$bad" -gt 0 ]; then
            echo "Stub smell detected (pass/NotImplementedError/TODO). Move real code, not skeletons."
            exit 1
          fi
