name: CI (lite)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Create venv
        run: python -m venv .venv

      - name: Install runtime (no RPi extras)
        run: |
          . .venv/bin/activate
          pip install -U pip setuptools wheel
          # tylko cross-platform pakiety; bez RPi.GPIO / spidev
          pip install \
            "flask>=3.1,<3.2" \
            "pillow>=11,<12" \
            "pyzmq>=25,<27" \
            "requests>=2.32,<3" \
            -c ops/agent/constraints.txt

      - name: Install test deps
        run: |
          . .venv/bin/activate
          pip install -r ops/agent/requirements-test.txt -c ops/agent/constraints.txt

      - name: Run tests (HW-safe)
        env:
          RIDER_APPS_PATH: _apps:apps
          FACE_LCD_ROTATE: "0"
          FACE_LCD_SPI_HZ: "32000000"
          FACE_LCD_FIT: fill
        run: |
          . .venv/bin/activate
          bash ops/agent/run_tests.sh
