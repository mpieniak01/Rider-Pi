name: Quality Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt || true; fi

      # 1) 600 linii – tylko zmienione pliki (chyba że label allow-oversize)
      - name: Check for allow-oversize label
        id: oversize
        shell: bash
        run: |
          set -euo pipefail
          labels="$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" || true)"
          echo "Labels: ${labels}"
          if printf '%s\n' "$labels" | grep -Fxq 'allow-oversize'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce max 600 lines per changed Python file
        if: steps.oversize.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$base" "$head" -- '*.py' || true)"
          [ -z "$CHANGED" ] && exit 0
          MAX=600; FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # case "$f" in tests/*) continue ;; esac   # odkomentuj, jeśli testy mają nie podlegać limitowi
            LINES="$(wc -l < "$f")"
            if [ "$LINES" -gt "$MAX" ]; then
              echo "::error file=$f,line=1::File has $LINES lines (max $MAX). Split it."
              FAIL=1
            fi
          done <<< "$CHANGED"
          exit $FAIL

      # 2) NO-STUB – blokuje „wydmuszki” w nowych liniach (chyba że allow-delete)
      - name: Check for allow-delete label
        id: del
        shell: bash
        run: |
          set -euo pipefail
          labels="$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" || true)"
          if printf '%s\n' "$labels" | grep -Fxq 'allow-delete'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce NO-STUB on additions
        if: steps.del.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad="$(git diff -U0 "$base" "$head" -- '*.py' \
            | grep -E '^\+[^+].*(\bpass\b|raise NotImplementedError|TODO|FIXME)' | wc -l || true)"
          if [ "$bad" -gt 0 ]; then
            echo "Stub smell detected in additions (pass/NotImplementedError/TODO)."
            exit 1
          fi

      # 3) Ruff
      - name: Ruff (lint + format check)
        shell: bash
        run: |
          ruff check
          ruff format --check

      # 4) Testy (lekko, szybko)
      - name: Tests
        env:
          ALSA_SKIP_LSOF: "1"
        shell: bash
        run: |
          pytest -q -k voice || pytest -q
