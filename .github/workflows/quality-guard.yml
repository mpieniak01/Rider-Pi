name: Quality Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  quality:
    runs-on: ubuntu-latest

    # ✅ domyślne wartości; później podmieniamy przez $GITHUB_ENV
    env:
      ALLOW_OVERSIZE: '0'
      ALLOW_DELETE: '0'
      NOSTUB_STRICT: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python (3.9 jak na urządzeniu)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Ensure jq present
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Install deps (ruff pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.6.9"
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Ruff version
        run: ruff --version

      # ---- flags z etykiet PR ----
      - name: Flags from labels
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          labels="$(jq -r '.pull_request.labels[].name // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          echo "labels: ${labels:-<none>}"
          case "$labels" in *"allow-oversize"*) echo "ALLOW_OVERSIZE=1" >>"$GITHUB_ENV";; esac
          case "$labels" in *"allow-delete"*)  echo "ALLOW_DELETE=1"  >>"$GITHUB_ENV";; esac
          case "$labels" in *"nostub-strict"*) echo "NOSTUB_STRICT=1" >>"$GITHUB_ENV";; esac

      # ---- 600 linii / plik (aktywny gdy ALLOW_OVERSIZE=0) ----
      - name: Enforce max 600 lines per changed Python file
        if: ${{ env.ALLOW_OVERSIZE == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$base" "$head" -- '*.py' || true)"
          [ -z "$CHANGED" ] && exit 0
          MAX=600; FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            LINES="$(wc -l < "$f")"
            if [ "$LINES" -gt "$MAX" ]; then
              echo "::error file=$f,line=1::File has $LINES lines (max $MAX). Split it."
              FAIL=1
            fi
          done <<< "$CHANGED"
          exit $FAIL

      # ---- NO-STUB (aktywny gdy ALLOW_DELETE=0) ----
      - name: NO-STUB (warn-only by default)
        if: ${{ env.ALLOW_DELETE == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          CHANGED_PY="$(git diff --name-only "$base" "$head" -- '*.py' || true)"
          if [ -z "$CHANGED_PY" ]; then
            echo "NO-STUB: no Python changes -> skip"
            exit 0
          fi

          diff_py="$(git diff -U0 "$base" "$head" -- '*.py' || true)"

          added_clean="$(
            printf '%s\n' "$diff_py" \
            | awk '/^\+[^+]/ { sub(/^\+/, "", $0); print }' \
            | awk '!/^[[:space:]]*($|#)/'
          )"

          pass_count="$(printf '%s\n' "$added_clean" | awk '/^[[:space:]]*pass([[:space:]]*#.*)?$/ {c++} END{print c+0}')"
          nie_count="$(printf '%s\n' "$added_clean" | awk '(/(^|[^A-Za-z0-9_])raise[[:space:]]+NotImplementedError([^A-Za-z0-9_]|$)/){c++} END{print c+0}')"

          echo "NO-STUB counts -> pass: $pass_count, NotImplementedError: $nie_count"
          bad=$((pass_count + nie_count))

          if [ "$bad" -gt 0 ] && [ "${NOSTUB_STRICT:-0}" = "1" ]; then
            echo "Stub smell in additions — strict mode"
            exit 1
          fi

          if [ "$bad" -gt 0 ]; then
            echo "::warning::Stub smell in additions (pass/NotImplementedError); use 'nostub-strict' label to enforce."
          else
            echo "NO-STUB: no stubs detected."
          fi

      # ---- CRLF detector ----
      - name: Detect CRLF in changed Python files
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$base" "$head" -- '*.py' || true)"
          [ -z "$CHANGED" ] && exit 0
          FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if grep -Iq . "$f" && grep -q $'\r' "$f"; then
              echo "::error file=$f,line=1::Detected CRLF in Python file (use LF). Tip: add '*.py text eol=lf' to .gitattributes and run 'git add --renormalize \"*.py\"'."
              FAIL=1
            fi
          done <<< "$CHANGED"
          exit $FAIL

      # ---- Ruff ----
      - name: Ruff (lint + format check, PR annotations)
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --output-format=github
          if ! ruff format --check .; then
            echo "::group::ruff format --diff"
            ruff format --diff .
            echo "::endgroup::"
            exit 1
          fi

      # ---- Systemd service files validation ----
      - name: Validate systemd service files (bash smoke test)
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating systemd service files..."
          bash scripts/diag_systemd-smoke.sh

      - name: Validate systemd service files (pytest static tests)
        shell: bash
        run: |
          set -euo pipefail
          echo "Running pytest-based systemd validation..."
          pip install pytest pytest-timeout
          pytest tests/test_systemd_services.py -v --tb=short

      - name: Feature API tests (UI summary)
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest tests/test_features_api.py -q

      - name: Scenario suite (S3–S11)
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          echo "Starting API server in background..."
          python -m services.api_server >/tmp/api_server.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          sleep 5
          bash tests/test_suite.sh http://127.0.0.1:8080
