name: Quality Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python (3.9 — jak na urządzeniu)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install deps (ruff)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install ruff
          # (opcjonalnie) soft: nie zbijaj joba jeśli brak pliku:
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      # --- 1) allow-oversize -> ENV ---
      - name: Check for allow-oversize label
        shell: bash
        run: |
          set -euo pipefail
          labels="$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" || true)"
          if printf '%s\n' "$labels" | grep -Fxq 'allow-oversize'; then
            echo "ALLOW_OVERSIZE=1" >> "$GITHUB_ENV"
          else
            echo "ALLOW_OVERSIZE=0" >> "$GITHUB_ENV"
          fi

      # --- 2) limit 600 linii na zmieniony plik .py (chyba że allow-oversize) ---
      - name: Enforce max 600 lines per changed Python file
        if: env.ALLOW_OVERSIZE != '1'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$base" "$head" -- '*.py' || true)"
          [ -z "$CHANGED" ] && exit 0
          MAX=600; FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            LINES="$(wc -l < "$f")"
            if [ "$LINES" -gt "$MAX" ]; then
              echo "::error file=$f,line=1::File has $LINES lines (max $MAX). Split it."
              FAIL=1
            fi
          done <<< "$CHANGED"
          exit $FAIL

      # --- 3) allow-delete -> ENV (wyłącza NO-STUB, jeśli trzeba) ---
      - name: Check for allow-delete label
        shell: bash
        run: |
          set -euo pipefail
          labels="$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" || true)"
          if printf '%s\n' "$labels" | grep -Fxq 'allow-delete'; then
            echo "ALLOW_DELETE=1" >> "$GITHUB_ENV"
          else
            echo "ALLOW_DELETE=0" >> "$GITHUB_ENV"
          fi

      # --- 4) NO-STUB (miękki) — tylko nowe linie, ignoruje komentarze/TODO/FIXME ---
      - name: Enforce NO-STUB on additions
        if: env.ALLOW_DELETE != '1'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          # Nowe linie (+), bez +++ i bez kontekstu:
          added="$(git diff -U0 "$base" "$head" -- '*.py' | grep -E '^\+[^+]' | sed 's/^+//')"

          # gołe 'pass' (bez komentarza po nim)
          pass_count="$(printf '%s\n' "$added" \
            | awk ' /^[[:space:]]*#/ {next} /^[[:space:]]*pass([[:space:]]*#.*)?$/ {c++} END{print c+0}' )"

          # 'raise NotImplementedError' w niekomentowanej linii
          nie_count="$(printf '%s\n' "$added" \
            | awk ' /^[[:space:]]*#/ {next} /[[:<:]]raise[[:space:]]+NotImplementedError[[:>:]]/ {c++} END{print c+0}' )"

          bad=$((pass_count + nie_count))
          echo "NO-STUB counts -> pass: $pass_count, NotImplementedError: $nie_count"
          [ "$bad" -eq 0 ] || { echo "Stub smell in additions."; exit 1; }

      # --- 5) Ruff (lint + format check) ---
      - name: Ruff (lint + format check)
        shell: bash
        run: |
          set -euo pipefail
          ruff check
          ruff format --check
