name: Quality Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt || true; fi

      # Jeśli PR ma label 'allow-oversize', pomijamy check 600 linii.
      - name: Check for allow-oversize label
        id: oversize
        run: |
          if jq -r '.pull_request.labels[].name' <<<"${{ toJson(github.event) }}" | grep -q '^allow-oversize$'; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Enforce max 600 lines per changed Python file
        if: steps.oversize.outputs.skip == 'false'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$base" "$head" -- '*.py' | tr '\n' ' ')
          [ -z "$CHANGED" ] && exit 0

          MAX=600
          FAIL=0
          for f in $CHANGED; do
            # (opcjonalnie) pomiń testy:
            # case "$f" in tests/*) continue ;; esac
            LINES=$(wc -l < "$f")
            if [ "$LINES" -gt "$MAX" ]; then
              echo "::error file=$f,line=1::File has $LINES lines (max $MAX). Split it into smaller modules."
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Ruff (lint + format check)
        run: |
          ruff check
          ruff format --check

      - name: Tests
        env:
          ALSA_SKIP_LSOF: "1"
        run: |
          pytest -q -k voice || pytest -q
