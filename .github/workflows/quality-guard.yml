name: Quality Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python (3.9 jak na urządzeniu)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Ensure jq present
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install deps (ruff pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.6.9"
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Ruff version
        run: ruff --version

      # ---- flags z etykiet PR ----
      - name: Flags from labels
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          labels="$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          echo "labels: ${labels:-<none>}"
          case "$labels" in *"allow-oversize"*) echo "ALLOW_OVERSIZE=1" >>"$GITHUB_ENV";; esac
          case "$labels" in *"allow-delete"*)  echo "ALLOW_DELETE=1"  >>"$GITHUB_ENV";; esac
          case "$labels" in *"nostub-strict"*) echo "NOSTUB_STRICT=1" >>"$GITHUB_ENV";; esac

      # ---- 600 linii / plik (chyba że allow-oversize) ----
      - name: Enforce max 600 lines per changed Python file
        if: env.ALLOW_OVERSIZE != '1'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$base" "$head" -- '*.py' || true)"
          [ -z "$CHANGED" ] && exit 0
          MAX=600; FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            LINES="$(wc -l < "$f")"
            if [ "$LINES" -gt "$MAX" ]; then
              echo "::error file=$f,line=1::File has $LINES lines (max $MAX). Split it."
              FAIL=1
            fi
          done <<< "$CHANGED"
          exit $FAIL

      # ---- NO-STUB (miękko) ----
      - name: NO-STUB (warn-only by default)
        if: env.ALLOW_DELETE != '1'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          added="$(git diff -U0 "$base" "$head" -- '*.py' | grep -E '^\+[^+]' | sed 's/^+//' | grep -vE '^[[:space:]]*#')"
          pass_count="$(printf '%s\n' "$added" | grep -Ec '^[[:space:]]*pass([[:space:]]*#.*)?$' || true)"
          nie_count="$(printf '%s\n' "$added" | grep -Ec '(^|[^A-Za-z0-9_])raise[[:space:]]+NotImplementedError([^A-Za-z0-9_]|$)' || true)"
          echo "NO-STUB counts -> pass: $pass_count, NotImplementedError: $nie_count"
          bad=$((pass_count + nie_count))
          if [ "$bad" -gt 0 ]; then
            if [ "${NOSTUB_STRICT:-0}" = "1" ]; then
              echo "Stub smell in additions — strict mode"; exit 1
            else
              echo "::warning::Stub smell in additions (pass/NotImplementedError); use 'nostub-strict' label to enforce."
            fi
          fi

      # ---- CRLF detector (najczęstsza przyczyna 'would reformat' na CI) ----
      - name: Detect CRLF in changed Python files
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$base" "$head" -- '*.py' || true)"
          [ -z "$CHANGED" ] && exit 0
          BAD=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Wykryj znak CR (0x0D); jeśli jest -> CRLF
            if grep -Iq . "$f" && grep -q $'\r' "$f"; then
              BAD="${BAD}${f}\n"
            fi
          done <<< "$CHANGED"
          if [ -n "$BAD" ]; then
            echo "::error::Detected CRLF in Python files (use LF). Offenders:\n${BAD}"
            echo "Tip: add '*.py text eol=lf' to .gitattributes and run 'git add --renormalize \"*.py\"'."
            exit 1
          fi

      # ---- Ruff ----
      - name: Ruff (lint + format check, PR annotations)
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --output-format=github
          # pokaż diff gdy --check nie przejdzie (łatwiejszy review)
          if ! ruff format --check .; then
            echo "::group::ruff format --diff"
            ruff format --diff .
            echo "::endgroup::"
            exit 1
          fi

      # ---- Systemd service files validation ----
      - name: Validate systemd service files
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating systemd service files..."
          bash scripts/diag_systemd-smoke.sh
