name: Ruff

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Ruff
        run: pip install "ruff==0.13.1"

      - name: Check formatting (ruff format --check)
        run: ruff format --check .

      - name: Lint (ruff check)
        run: ruff check . --output-format=github --statistics
