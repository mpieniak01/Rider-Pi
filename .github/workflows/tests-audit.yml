name: tests-audit

on:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/diag_tests-audit.sh'
      - 'tests/**'
      - 'Makefile'
      - 'pytest.ini'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'scripts/diag_tests-audit.sh'
      - 'tests/**'
      - 'Makefile'
      - 'pytest.ini'
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install audit deps
        run: |
          python -m pip install --upgrade pip
          # jeśli wolisz z pliku, utwórz scripts/tests_audit_requirements.txt
          # i zamień poniższą linijkę na: pip install -r scripts/tests_audit_requirements.txt
          pip install pyflakes

      - name: Run audit
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/diag_tests-audit.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tests-audit
          path: |
            tests/_audit_report.csv
            tests/_suggested_delete.txt
            tests/_suggested_migrate.txt
          if-no-files-found: warn
