name: tests-audit

on:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/diag_tests-audit.sh'
      - 'tests/**'
      - 'Makefile'
      - 'pytest.ini'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'scripts/diag_tests-audit.sh'
      - 'tests/**'
      - 'Makefile'
      - 'pytest.ini'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install audit deps
        run: |
          python -m pip install --only-binary=:all: pip==25.3
          # jeśli wolisz z pliku, utwórz scripts/tests_audit_requirements.txt
          # i zamień poniższą linijkę na: pip install -r scripts/tests_audit_requirements.txt
          python -m pip install --only-binary=:all: pyflakes==3.4.0

      - name: Run audit
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/diag_tests-audit.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: tests-audit
          path: |
            tests/_audit_report.csv
            tests/_suggested_delete.txt
            tests/_suggested_migrate.txt
          if-no-files-found: warn
