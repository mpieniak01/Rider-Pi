name: tests-audit

on:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/diag_tests-audit.sh'
      - 'tests/**'
      - 'Makefile'
      - 'pytest.ini'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'scripts/diag_tests-audit.sh'
      - 'tests/**'
      - 'Makefile'
      - 'pytest.ini'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install audit deps
        run: |
          python -m pip install --only-binary=:all: pip==25.3
          # jeśli wolisz z pliku, utwórz scripts/tests_audit_requirements.txt
          # i zamień poniższą linijkę na: pip install -r scripts/tests_audit_requirements.txt
          python -m pip install --only-binary=:all: pyflakes==3.4.0

      - name: Run audit
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/diag_tests-audit.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tests-audit
          path: |
            tests/_audit_report.csv
            tests/_suggested_delete.txt
            tests/_suggested_migrate.txt
          if-no-files-found: warn
