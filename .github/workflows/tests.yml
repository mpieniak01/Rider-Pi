name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.9"]

    env:
      PYTHONPATH: .
      RIDER_PI_CI: "1"
      RIDER_PI_MOCK_HW: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test deps (no package build)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # opcjonalne zależności projektu
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          # minimalny zestaw dla testów + piny zgodne z RPi
          python -m pip install pytest pytest-cov
          python -m pip install pillow==8.1.2
          python -m pip install "flask<3" "werkzeug<3"
          python -m pip install "requests>=2.31,<3"
          python -m pip install "pyzmq>=22,<26"

      - name: Verify deps
        run: |
          python - <<'PY'
          import sys
          import PIL, flask, requests, zmq
          print("Python:", sys.version)
          print("Pillow:", PIL.__version__)
          print("Flask:", flask.__version__)
          print("Requests:", requests.__version__)
          print("pyzmq:", zmq.__version__)
          PY

      - name: Run tests
        run: |
          pytest -q --maxfail=1 --disable-warnings -k "not slow" \
                 --cov=. --cov-report=term-missing --cov-report=html

      - name: Upload coverage (HTML)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
          