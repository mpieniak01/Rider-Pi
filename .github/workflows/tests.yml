name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.9"]

    env:
      PYTHONPATH: .
      RIDER_PI_CI: "1"
      RIDER_PI_MOCK_HW: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test deps (no package build)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          python -m pip install pytest pytest-cov
          python -m pip install pillow==8.1.2
          python -m pip install "flask<3" "werkzeug<3"
          python -m pip install "requests>=2.31,<3"
          python -m pip install "pyzmq>=22,<26"

      - name: Verify deps
        run: |
          python - <<'PY'
          import sys, PIL, flask, requests, zmq
          print("Python:", sys.version)
          print("Pillow:", PIL.__version__)
          print("Flask:", flask.__version__)
          print("Requests:", requests.__version__)
          print("pyzmq:", zmq.__version__)
          PY

      # === NOWE: uruchom API na :8000 i poczekaj aż wstanie ===
      - name: Start API (background on :8000)
        run: |
          set -euo pipefail
          # Zmień poniższą komendę na właściwą dla Twojej aplikacji:
          python -u services/api_server.py & echo $! > api.pid
          # Czekaj aż odpowie HTTP 200/OK
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "API is up"; break
            fi
            sleep 0.5
          done

      - name: Run tests
        env:
          BASE_URL: "http://127.0.0.1:8000"
        run: |
          pytest -q --maxfail=1 --disable-warnings -k "not slow" \
                 --cov=. --cov-report=term-missing --cov-report=html

      - name: Stop API
        if: ${{ always() }}
        run: |
          if [ -f api.pid ]; then kill "$(cat api.pid)" || true; fi

      - name: Upload coverage (HTML)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore