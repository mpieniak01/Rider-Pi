name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.9"]

    env:
      PYTHONPATH: .
      RIDER_PI_CI: "1"
      RIDER_PI_MOCK_HW: "1"
      RIDER_TEST_ISOLATED: "1"
      MOTION_ENABLE: "0"
      ESTOP_GPIO: "-1"
      BUS_PUB_ADDR: "inproc://rider-ci-publish"
      BUS_SUB_ADDR: "inproc://rider-ci-subscribe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test deps (no package build)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Ten sam zestaw programowy co WSL; nie instalujemy opcjonalnych ML/providerów.
          python -m pip install -r config/agent/requirements-wsl.txt \
                                -c config/agent/constraints.txt

      - name: Run operator panel fixtures (isolated JavaScript)
        run: node --experimental-vm-modules --test tests/operator_panel.test.mjs tests/operator_panel_shared_review.test.mjs tests/legacy_catalog.test.mjs

      - name: Start API (background on :8080)
        env:
          STATUS_API_PORT: "8080"
          FEATURE_STATE_PATH: "${{ runner.temp }}/rider-feature-state.json"
        run: |
          set -euo pipefail
          python -u -m services.api_server > api.log 2>&1 & echo $! > api.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "API is up"; break
            fi
            if ! kill -0 "$(cat api.pid)" 2>/dev/null; then
              tail -n 50 api.log
              exit 1
            fi
            sleep 0.5
          done
          if ! curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
            tail -n 50 api.log
            exit 1
          fi

      - name: Run tests
        env:
          RUN_DEVICE_TESTS: "0"
          VOICE_EXPERIMENTAL: "1"
          BASE_URL: "http://127.0.0.1:8080"
        run: |
          pytest -q tests/test_pi_deploy.py
          pytest -q tests/test_motion_safety_contract.py tests/test_uart_ownership.py \
                    tests/test_control_safety_http.py tests/test_test_sandbox.py \
                    tests/test_task_producer_safety.py tests/test_motion_failure_contract.py \
                    tests/test_xgo_sensor_contract.py tests/test_optional_oauth.py
          pytest -q tests/orchestration tests/test_robot_ctl_contract.py \
                    tests/test_lcd_idle_guard.py tests/test_resource_diag.py tests/test_resource_api.py
          pytest -q -k voice -m "not hardware and not network" \
                 --cov=. --cov-report=term-missing --cov-report=html

      - name: Stop API
        if: ${{ always() }}
        run: |
          if [ -f api.pid ]; then kill "$(cat api.pid)" || true; fi

      - name: Upload coverage (HTML)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore

  systemd-smoke:
    runs-on: ubuntu-latest
    # Only run on self-hosted runners or when explicitly enabled
    if: ${{ contains(github.event.pull_request.labels.*.name, 'test-systemd') }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-timeout

      - name: Check systemd availability
        id: systemd-check
        run: |
          if systemctl --version >/dev/null 2>&1; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Run systemd smoke tests
        if: steps.systemd-check.outputs.available == 'true'
        env:
          SYSTEMD_SMOKE_TESTS: "1"
        run: |
          pytest tests/test_systemd_smoke.py -v --tb=short

      - name: Skip systemd smoke tests
        if: steps.systemd-check.outputs.available != 'true'
        run: |
          echo "⚠️ systemd not available, skipping smoke tests"
          echo "These tests require a systemd-enabled environment"
