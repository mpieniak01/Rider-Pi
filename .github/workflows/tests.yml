name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.9"]  # dopasowane do target-version=py39 (Ruff). Możesz dodać "3.10", "3.11".

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          set -euxo pipefail
          # Preferuj instalację z pyproject (extras "dev" jeżeli są)
          if [ -f pyproject.toml ]; then
            python -m pip install ".[dev]" || python -m pip install .
          fi
          # Fallbacki gdy są pliki wymagań
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
          # Narzędzia pomocnicze do coverage (opcjonalnie)
          python -m pip install pytest pytest-cov

      - name: Run tests
        env:
          # Jeśli testy wymagają mocków sprzętowych — ustaw dowolne flaki/feature flags
          RIDER_PI_CI: "1"
          RIDER_PI_MOCK_HW: "1"
        run: |
          pytest -q --maxfail=1 --disable-warnings -k "not slow" --cov=. --cov-report=term-missing

      - name: Upload coverage (HTML)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
