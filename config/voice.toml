[meta]
schema = "voice"
version = 1

[capture]
backend = "alsa"
device = "plughw:wm8960soundcard,0"
sample_rate = 16000
channels = 1
frame_ms = 20
buffer_seconds = 0.60

[vad]
enabled = true
mode = 0
frame_ms = 20
tail_ms = 1400
max_len_ms = 6000
energy_gate_dbfs = -25

[hotword]
enabled = false
engine = "ptt"

[asr]
backend = "openai"
model = "gpt-4o-mini-transcribe"
language = "pl"
prompt = "Polski asystent głosowy. Przykłady: 'Co jest stolicą Polski?', 'Która jest teraz godzina?'. Transkrybuj wiernie po polsku."

[chat]
backend = "openai"
model = "gpt-4o-mini"
system_prompt = "Odpowiadaj pełnym zdaniem po polsku."
max_history = 4
max_tokens = 120

[tts]
backend = "openai"
model = "gpt-4o-mini-tts"
voice = "verse"
format = "mp3"

[playback]
backend = "alsa"
alsa_device = "plughw:wm8960soundcard,0"
volume = 100

[playback.ding]
enabled = true
gain_db = 3.0

[service]
save_audio = true
recordings_dir = "/tmp/voice-recs"
history_size = 20
pre_speech_wait_ms = 800
min_capture_ms = 900
beep_pause_ms = 380
mic_open_delay_ms = 220
post_tts_mute_ms = 500
guard_ms = 0

[logging]
level = "INFO"
