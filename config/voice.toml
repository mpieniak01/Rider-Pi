# config/voice.toml — Rider-Pi (realtime WS + ALSA WM8960, BEZ ~/.asoundrc)
# Uwaga: aktywnie używamy "hw:wm8960soundcard,0" + 16 kHz S16_LE STEREO (mono nie przechodzi).
# Poprzednie wpisy dsnoop/dmix zostawiamy w komentarzach.

[logging]
level = "DEBUG"             # Na testy DEBUG; na produkcji INFO.

[capture]
# --- POPRZEDNIO (zostawiamy do referencji):
# device      = "dsnoop:CARD=wm8960soundcard,DEV=0"  # równoważne: "dsnoop:1,0"
# sample_rate = 48000
# channels    = 2
# --- AKTYWNE (sprawdzone dziś): HW 16 kHz S16_LE, 2ch
device      = "hw:wm8960soundcard,0"
sample_rate = 16000
channels    = 2
# format     = "S16_LE"      # (opcjonalnie; nasz arecord i tak wymusza S16_LE)

[playback]
backend     = "alsa"
# --- POPRZEDNIO:
# device      = "dmix:CARD=wm8960soundcard,DEV=0"    # równoważne: "dmix:1,0"
# alsa_device = "dmix:CARD=wm8960soundcard,DEV=0"
# --- AKTYWNE (sprawdzone dziś): HW bez miksu (lightdm/pulseaudio zatrzymane)
alsa_device = "hw:wm8960soundcard,0"
volume      = 100                                   # 0–100 (jeśli backend wspiera)

[asr]
transport = "realtime"
language  = "pl"

[asr.vad]
# W PTT zwykle OFF (włączymy później przy nasłuchu ciągłym).
# POPRZEDNIO: enabled = true
enabled        = false
aggressiveness = 3
start_ms       = 150
end_ms         = 900

[chat]
transport = "realtime"

[tts]
transport = "realtime"
voice     = "verse"
# POPRZEDNIO: format="pcm16" — obecnie nieużywane przez nasz kod, zostawiam w komentarzu
# format    = "pcm16"

[stream]
auth                = "env:OPENAI_API_KEY"
# ENV OPENAI_REALTIME_ENDPOINT ma pierwszeństwo nad tym polem:
endpoint            = "wss://api.openai.com/v1/realtime?model=gpt-4o-realtime-preview"
ping_interval_s     = 10

# Audio do WS: zawsze 16 kHz mono po stronie modelu; my wysyłamy 20 ms ramki.
chunk_ms            = 20
sample_rate         = 16000

# Domykanie tur (serwerowe):
turn_end_silence_ms = 600
max_turn_ms         = 6000

# Te klucze mogą być ignorowane przez bieżącą wersję kodu, ale zostawiamy je:
send_partials       = true
server_vad          = true
local_vad_fallback  = true

[stream.audio]
# Mogą być ignorowane w tej wersji; zachowujemy.
jitter_buffer_ms = 80
barge_in         = true

[stream.reconnect]
max_retries = 6
base_ms     = 250
max_ms      = 5000

[service]
beep          = true
beep_delay_ms = 250

[service.turn]
max_turn_ms    = 6000
key_exit       = true
commit_on_key  = true
