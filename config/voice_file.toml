# Minimalny, stabilny tryb plikowy: WAV/PCM16 + czyste ALSA (WM8960)

[capture]
device        = "wm8960_in"
sample_rate   = 16000     # było: rate
channels      = 1
sample_format = "S16_LE"  # było: format

[playback]
backend = "aplay"
device  = "wm8960_out"

[asr]
backend  = "openai"
model    = "whisper-1"
language = "pl"

[chat]
backend       = "openai"
model         = "gpt-4o-mini"
language      = "pl"
system_prompt = "Jesteś asystentem głosowym Rider-Pi. Odpowiadaj krótko po polsku."

[tts]
backend = "openai"
format  = "wav"    # aplay wymaga WAV/PCM16 w tym pipeline
voice   = "alloy"  # sprawdzony głos

[nlu]
chat_threshold = 0.6
llm_model      = "gpt-4o-mini"

[nlu.command_keywords]
stop        = ["stop", "przerwij"]
volume_up   = ["głośniej", "głośniej proszę"]
volume_down = ["ciszej", "ciszej proszę"]

[hotword]
enabled = false
engine  = "ptt"
