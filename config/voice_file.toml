# Minimalny, stabilny plikowy tryb rozmowy (WAV + ALSA)
[capture]
device   = "wm8960_in"    # mikrofon (WE)
rate     = 16000
channels = 1
format   = "s16le"
backend  = "arecord"

[playback]
device   = "wm8960_out"   # głośnik (WY)
backend  = "aplay"        # bez Pulse
volume   = 55

[asr]
backend  = "openai"
model    = "whisper-1"

[chat]
backend       = "openai"
model         = "gpt-4o-mini"
language      = "pl"
system_prompt = "Jesteś asystentem głosowym Rider-Pi. Odpowiadaj krótko po polsku."

[tts]
format   = "wav"          # najpewniejsze z aplay
voice    = "alloy"
