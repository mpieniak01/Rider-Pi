# Minimalny, stabilny tryb plikowy: WAV/PCM16 + czyste ALSA (WM8960)

[capture]
device        = "wm8960_in"
sample_rate   = 16000
channels      = 1
sample_format = "S16_LE"

[playback]
backend = "aplay"          # czyste ALSA (bez Pulse)
device  = "wm8960_out"     # wyjście WM8960

[asr]
backend  = "openai"
model    = "whisper-1"
language = "pl"

[chat]
backend       = "openai"
model         = "gpt-4o-mini"
language      = "pl"
system_prompt = "Jesteś asystentem głosowym Rider-Pi. Odpowiadaj krótko po polsku."

[tts]
backend = "openai"
model   = "gpt-4o-mini-tts"
format  = "wav"            # zgodne z aplay
voice   = "ash"            # możesz zmienić na "alloy" itp.

[nlu]
chat_threshold   = 0.0
llm_model        = "dummy"
command_keywords = {}

[hotword]
enabled = false
engine  = "none"

