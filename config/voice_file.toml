# Minimalny, stabilny tryb plikowy: WAV/PCM16 + czyste ALSA (WM8960)

[capture]
device = "wm8960_in"
rate   = 16000
channels = 1
format = "S16_LE"

[playback]
backend = "aplay"
device  = "wm8960_out"

[asr]
backend  = "openai"
model    = "whisper-1"
language = "pl"

[chat]
backend       = "openai"
model         = "gpt-4o-mini"
language      = "pl"
system_prompt = "Jesteś asystentem głosowym Rider-Pi. Odpowiadaj krótko po polsku."

[tts]
backend = "openai"
format  = "wav"
voice   = "alloy"

[nlu]
backend = "passthrough"

[hotword]
enabled = false
engine  = "ptt"
