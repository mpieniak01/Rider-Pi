# config/voice_streaming.toml — PTT + Realtime WS (PL), zgodny z aktualnym kodem

[logging]
level = "INFO"

[capture]
backend        = "alsa"
device         = "wm8960_in"
sample_rate    = 16000
channels       = 1
frame_ms       = 20            # zgodnie z naszymi chunkami
buffer_seconds = 0.10          # mniejszy bufor = mniejsza latencja

[playback]
backend = "alsa"
device  = "wm8960_out"
volume  = 55

[asr]
transport = "realtime"
language  = "pl"

[chat]
transport     = "realtime"
# przeniesione z [stream.session.instructions]
system_prompt = "Mów po polsku, krótko i rzeczowo. Jeśli pytanie jest krótkie, odpowiadaj w 1–2 zdaniach."

[tts]
transport = "realtime"
voice     = "ash"
format    = "pcm16"            # zgodnie z tym, co wysyła _send_session_update()

[stream]
# <<< KLUCZ CZYTANY Z ~/.bash_profile >>>
auth                = "bashenv:~/.bash_profile:OPENAI_API_KEY"
endpoint            = "wss://api.openai.com/v1/realtime?model=gpt-4o-realtime-preview"
chunk_ms            = 20
sample_rate         = 16000
turn_end_silence_ms = 700
max_turn_ms         = 15000      # więcej czasu na wypowiedź
send_partials       = false
server_vad          = true
local_vad_fallback  = false
ping_interval_s     = 10
# request_on_commit – nieużywane przez kod, commit i tak wysyła response.create

[stream.audio]
jitter_buffer_ms = 80            # balans: płynność vs. latencja
barge_in         = true

[stream.reconnect]
max_retries = 6
base_ms     = 250
max_ms      = 5000

[service]
beep          = true
beep_delay_ms = 250

[service.turn]
max_turn_ms   = 15000
key_exit      = true
commit_on_key = true
