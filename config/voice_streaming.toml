# ---------------------------------------------------------------------------
# Rider-Pi / voice_streaming.toml
# Tryb: STREAMING (ptt) – duplex WS: CAPTURE → CHAT (REST/WS) → TTS (stream)
# Używa ALSA aliasów z config/alsa/asoundrc.wm8960 (export ALSA_CONFIG_PATH).
# Ten plik służy do testów funkcjonalnych PTT przez WebSocket.
# ---------------------------------------------------------------------------

lang = "pl"

[capture]
device      = "wm8960_in"
sample_rate = 16000
channels    = 1
# Uwaga: w trybie streaming zwykle używamy natywnego capture mixina.
# Jeśli w logach pojawi się "Unsupported capture backend: dummy", rozważ:
# backend = "arecord"

[playback]
device = "wm8960_out"

[asr]
backend = "openai"
model   = "gpt-4o-mini-transcribe"   # w razie potrzeby: "whisper-1"

[chat]
backend       = "openai"
model         = "gpt-4o-mini"
system_prompt = "Jesteś asystentem głosowym Rider-Pi. Odpowiadaj krótko po polsku."

[nlu]
chat_threshold = 0.65
llm_model      = "gpt-4o-mini"

[nlu.command_keywords]
stop         = ["stop", "pauza", "koniec", "cisza"]
repeat       = ["powtórz", "jeszcze raz"]
volume_up    = ["głośniej", "podgłośnij", "+10"]
volume_down  = ["ciszej", "ścisz", "-10"]

[hotword]
enabled = true
engine  = "ptt"   # sterowanie przyciskiem w trybie streaming

[tts]
backend    = "openai"
voice      = "ash"
format     = "mp3"
player_cmd = "./ops/audio/mpg123.sh"  # ALSA → wm8960_out (bez Pulse)
