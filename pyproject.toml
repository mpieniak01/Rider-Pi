[tool.ruff]
line-length = 120
target-version = "py39"
respect-gitignore = true

# Jedno źródło prawdy dla CI i lokalnie:
extend-exclude = [
  "_apps/",
  "attic/",
  "venv/",
  ".venv/",
  "build/",
  "dist/",
  "__pycache__/",
  "fast565.egg-info/",
  # całe drzewka starych snapshotów:
  "services/_deprecated_*/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = []
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F401", "F811", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "services", "tools"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "preserve"
