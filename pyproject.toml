[tool.ruff]
line-length = 120
respect-gitignore = true
target-version = "py39"
extend-exclude = [
  "_apps", "_apps/**",
  "attic", "attic/**",
  "venv", ".venv", "build", "dist", "__pycache__",
  "services/_deprecated_*", "services/_deprecated_*/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = []
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F401", "F811", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "services", "tools"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "preserve"
