[tool.ruff]
required-version = "0.6.9"
line-length = 120
extend-exclude = [
  "_apps/",
  "venv/",
  ".venv/",
  "build/",
  "dist/",
  "__pycache__/",
  "**/*.egg-info/",
  ".ipynb_checkpoints/",
  "**/_todelete/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = []
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F401", "F811", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "services"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "preserve"
