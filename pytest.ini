[pytest]
markers =
    hardware: physical hardware checks excluded from automated pytest
    physical_motion: manual actuator procedure, never an automated test
    network: test requiring explicitly isolated networking
addopts = -q --timeout=120 --timeout-method=thread
filterwarnings =
    ignore:Deprecated call to `pkg_resources\.declare_namespace\(':DeprecationWarning
    ignore::DeprecationWarning
    ignore::UserWarning
norecursedirs =
    lama.cpp
    llama.cpp
