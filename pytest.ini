# pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = .git .github .ipynb_checkpoints build dist venv .*_cache

# Rejestracja znaczników (eliminuje ostrzeżenie Unknown pytest.mark.timeout)
markers =
    timeout: per-test timeout in seconds (requires pytest-timeout plugin)

# Opcjonalne wyciszenia ostrzeżeń z logów testów
filterwarnings =
    ignore:Unknown pytest\.mark\.timeout:pytest.PytestUnknownMarkWarning
    ignore:pkg_resources is deprecated as an API:UserWarning
    ignore:Deprecated call to `pkg_resources\.declare_namespace\('google'\)`:DeprecationWarning
    ignore:Deprecated call to `pkg_resources\.declare_namespace\('mpl_toolkits'\)`:DeprecationWarning
    ignore:Deprecated call to `pkg_resources\.declare_namespace\('zope'\)`:DeprecationWarning
    ignore:Deprecated call to `pkg_resources\.declare_namespace\('logilab'\)`:DeprecationWarning

