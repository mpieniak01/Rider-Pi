<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rider-Pi — Diagnostyka</title>
  <script src="/web/assets/theme-loader.js" defer></script>
  <link rel="stylesheet" href="/web/assets/dashboard-common.css">
  <link rel="stylesheet" href="/web/assets/themes/classic/theme.css" data-theme-skin="classic">
  <link rel="stylesheet" href="/web/assets/themes/classic-plus/theme.css" data-theme-skin="classic-plus" disabled>
  <link rel="stylesheet" href="/web/assets/themes/v2/theme.css" data-theme-skin="v2" disabled>
  <link rel="stylesheet" href="/web/assets/themes/v3/theme.css" data-theme-skin="v3" disabled>
  <link rel="stylesheet" href="/web/assets/pages/system.css">
</head>
<body data-page="system" class="page page-system">
  <header class="layout-header" data-dashboard-menu-target></header>
  <main class="layout-main">
    <header class="page-header">
      <div class="page-header__titles">
        <h1 class="page-title"><span class="brand-accent">Rider-Pi</span>: <span class="page-title-text" data-i18n="system_ui.title">Diagnostyka</span></h1>
      </div>
      <div class="page-header__actions page-header__actions--small system-links">
        <a href="/view" data-i18n="nav.view">Przegląd</a>
        <a href="/control" data-i18n="nav.control">Sterowanie robotem</a>
      </div>
    </header>
    <p class="muted" data-i18n="system_ui.description">Stan usług i połączenia komponentów. Ten ekran służy do odczytu; robotem sterujesz w zakładce Sterowanie robotem.</p>
    <p id="status-line" class="status-line c-statusbar" role="status" aria-live="polite"></p>
    <div id="system-summary" class="l-cluster system-summary" aria-label="Podsumowanie usług" data-i18n-attr="aria-label:system_ui.summary"></div>
    <section id="system-network" class="system-section is-network" aria-live="polite"></section>
    <div id="system-graph" class="system-groups"></div>
    <details class="system-details c-card">
      <summary data-i18n="system_ui.details">Szczegóły usług</summary>
      <div class="system-table-scroll" tabindex="0" role="region" aria-label="Tabela usług" data-i18n-attr="aria-label:system_ui.table">
        <table id="system-table" class="c-table"><thead></thead><tbody></tbody></table>
      </div>
    </details>
  </main>
  <footer class="layout-footer" data-dashboard-footer-target></footer>
  <script type="module" src="/web/assets/pages/system.js"></script>
  <script type="module" src="/web/assets/menu.js"></script>
  <script type="module" src="/web/assets/footer.js"></script>
</body>
</html>
